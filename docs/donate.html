<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Поддержать Aeroway</title>
  <meta name="description" content="Добровольная поддержка Aeroway через ЮKassa.">
  <link rel="icon" href="https://raw.githubusercontent.com/RaccoonLaptop/Aeroway/main/Assets/icon-readme.png">
  <link rel="stylesheet" href="https://yookassa.ru/integration/simplepay/css/yookassa_construct_form.css?v=1.35.0">
  <style>
    :root {
      --bg: #050b1b;
      --surface: #0d2240;
      --surface-light: #12355b;
      --border: #2a4d73;
      --accent: #e0b240;
      --accent-hover: #f0cc62;
      --text: #f4e7c6;
      --muted: #c9b896;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      font-size: 15px;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-hover); text-decoration: underline; }
    .wrap { max-width: 480px; margin: 0 auto; padding: 48px 20px 64px; }
    header { text-align: center; margin-bottom: 28px; }
    header img { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 14px; }
    h1 { font-size: 1.6rem; margin: 0 0 8px; font-weight: 650; }
    .lead { color: var(--muted); margin: 0; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 22px 22px 18px;
    }
    .yoomoney-payment-form {
      max-width: none;
      margin: 0;
      padding: 0;
      font-family: inherit;
      color: var(--text);
    }
    .yoomoney-payment-form .ym-block-title {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      margin: 0 0 8px;
    }
    .yoomoney-payment-form .ym-customer-info .ym-input { margin-top: 0; }
    .yoomoney-payment-form .ym-input {
      height: 44px;
      line-height: 44px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-light);
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      padding: 0 14px;
    }
    .yoomoney-payment-form .ym-input::placeholder { color: #6d7894; }
    .yoomoney-payment-form .ym-input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .yoomoney-payment-form .ym-before-line { padding-top: 0; }
    .yoomoney-payment-form .ym-before-line:before { display: none; }
    .yoomoney-payment-form .ym-payment-btn-block {
      height: auto;
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 12px;
    }
    .yoomoney-payment-form .ym-input-icon-rub {
      margin: 0;
      min-width: 0;
      width: 100%;
    }
    .yoomoney-payment-form .ym-input-icon-rub:after {
      color: var(--muted);
      height: 44px;
      line-height: 44px;
      right: 14px;
    }
    .yoomoney-payment-form .ym-input-icon-rub input { padding-right: 32px; }
    .yoomoney-payment-form .ym-payment-btn-block .ym-btn-pay {
      max-width: none;
      width: 100%;
      min-height: 46px;
      height: 46px;
      margin: 0;
      padding: 0 16px;
      border: 0;
      border-radius: 10px;
      background: #e0b240;
      color: #050b1b;
      font-family: inherit;
      font-size: 15px;
      font-weight: 650;
      justify-content: center;
      align-items: center;
      gap: 8px;
      text-transform: none;
      cursor: pointer;
    }
    .yoomoney-payment-form .ym-payment-btn-block .ym-btn-pay:hover { background: #f0cc62; }
    .btn-icon { width: 18px; height: 18px; flex: 0 0 auto; }
    .form-hint {
      display: none;
      margin: 8px 0 0;
      color: #f0a0ae;
      font-size: 13px;
      text-align: center;
    }
    .form-hint:not(:empty) { display: block; }
    .yoomoney-payment-form .ym-payment-btn-block .ym-btn-pay .ym-text-crop {
      flex: 0 0 auto;
      margin: 0;
      text-align: center;
    }
    .yoomoney-payment-form .ym-logo { display: none; }
    .note {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }
    footer { text-align: center; color: var(--muted); font-size: 13px; margin-top: 28px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <img src="https://raw.githubusercontent.com/RaccoonLaptop/Aeroway/main/Assets/icon-readme.png" alt="Aeroway">
      <h1>Поддержать Aeroway</h1>
      <p class="lead">Сумму выбираете сами. Оплата откроется на странице ЮKassa.</p>
    </header>
    <div class="card">
      <form class="yoomoney-payment-form" action="https://yookassa.ru/integration/simplepay/payment" method="post" accept-charset="utf-8">
        <div class="ym-products ym-display-none">
          <div class="ym-product">
            <div class="ym-product-line">
              <span class="ym-product-description"><span class="ym-product-count">1×</span>Поддержка</span>
              <span class="ym-product-price" data-price="0.0" data-id="13" data-count="1">0,00&nbsp;₽</span>
            </div>
            <input disabled type="hidden" name="text" value="Поддержка">
            <input disabled type="hidden" name="price" value="0.0">
            <input disabled type="hidden" name="quantity" value="1">
            <input disabled type="hidden" name="paymentSubjectType" value="service">
            <input disabled type="hidden" name="paymentMethodType" value="full_payment">
            <input disabled type="hidden" name="tax" value="1">
          </div>
        </div>
        <input value="" type="hidden" name="ym_merchant_receipt">
        <div class="ym-customer-info">
          <div class="ym-block-title">Телефон или почта для чека</div>
          <input class="ym-input" name="email" placeholder="mail@example.com" type="text">
        </div>
        <div class="ym-hidden-inputs">
          <input name="shopSuccessURL" type="hidden" value="https://raccoonlaptop.github.io/Aeroway/thanks.html">
          <input name="shopFailURL" type="hidden" value="https://raccoonlaptop.github.io/Aeroway/donate.html">
        </div>
        <input name="customerNumber" type="hidden" value="Добровольная поддержка Aeroway">
        <input name="sumEqualPrice" type="hidden" value="true">
        <div class="ym-payment-btn-block ym-before-line ym-align-space-between">
          <div class="ym-block-title">Сумма</div>
          <div class="ym-input-icon-rub">
            <input name="sum" placeholder="100" class="ym-input ym-sum-input ym-required-input" type="number" step="any" min="1">
          </div>
          <button type="button" id="openPay" data-text="Поддержать" class="ym-btn-pay ym-result-price"><svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg><span class="ym-text-crop">Поддержать</span> <span class="ym-price-output"></span></button>
          <p class="form-hint" id="formHint"></p>
          <img src="https://yookassa.ru/integration/simplepay/img/iokassa-gray.svg?v=1.35.0" class="ym-logo" width="114" height="27" alt="ЮKassa">
        </div>
        <input name="shopId" type="hidden" value="1219833">
      </form>
      <p class="note">Деньги приходят в ЮKassa. Это добровольная поддержка, без подписки.</p>
    </div>
    <footer>
      <a href="./">К руководству</a>
      · <a href="https://github.com/RaccoonLaptop/Aeroway">GitHub</a>
      · <a href="https://t.me/ZapretUI">Telegram</a>
    </footer>
  </div>
  <script src="https://yookassa.ru/integration/simplepay/js/yookassa_construct_form.js?v=1.35.0"></script>
  <script>
    const form = document.querySelector(".yoomoney-payment-form");
    const hint = document.getElementById("formHint");

    document.getElementById("openPay").addEventListener("click", function () {
      const email = form.email.value.trim();
      const sum = parseFloat(form.sum.value);
      if (!email) {
        hint.textContent = "Укажите телефон или почту для чека";
        form.email.focus();
        return;
      }
      if (!sum || sum <= 0) {
        hint.textContent = "Укажите сумму";
        form.sum.focus();
        return;
      }
      hint.textContent = "";
      form.requestSubmit();
    });
  </script>
  <script src="wavy.js"></script>
</body>
</html>
