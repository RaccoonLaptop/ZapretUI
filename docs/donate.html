<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Поддержать Zapret UI</title>
  <meta name="description" content="Добровольная поддержка Zapret UI через ЮKassa.">
  <link rel="icon" href="https://raw.githubusercontent.com/RaccoonLaptop/ZapretUI/main/Assets/icon-readme.png">
  <link rel="stylesheet" href="https://yookassa.ru/integration/simplepay/css/yookassa_construct_form.css?v=1.35.0">
  <style>
    :root {
      --bg: #08090d;
      --surface: #10121a;
      --border: #2d3348;
      --accent: #6b9fff;
      --accent-hover: #8ab4ff;
      --text: #e8ebf4;
      --muted: #a8b3d0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      font-size: 15px;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-hover); text-decoration: underline; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 32px 20px 64px; }
    header { text-align: center; margin-bottom: 24px; }
    header img { width: 72px; height: 72px; border-radius: 16px; margin-bottom: 12px; }
    h1 { font-size: 1.7rem; margin: 0 0 8px; }
    p { color: var(--muted); }
    .card {
      background: #fff;
      color: #1a1a1a;
      border-radius: 12px;
      padding: 8px 16px 16px;
    }
    footer { text-align: center; color: var(--muted); font-size: 13px; margin-top: 28px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <img src="https://raw.githubusercontent.com/RaccoonLaptop/ZapretUI/main/Assets/icon-readme.png" alt="Zapret UI">
      <h1>Поддержать Zapret UI</h1>
      <p>Сумму выбираете сами. Оплата проходит на странице ЮKassa. Для чека укажите телефон или почту.</p>
    </header>
    <div class="card">
      <form class="yoomoney-payment-form" action="https://yookassa.ru/integration/simplepay/payment" method="post" accept-charset="utf-8">
        <div class="ym-products ym-display-none">
          <div class="ym-block-title ym-products-title">Товары</div>
          <div class="ym-product">
            <div class="ym-product-line">
              <span class="ym-product-description"><span class="ym-product-count">1×</span>Поддержка</span>
              <span class="ym-product-price" data-price="0.0" data-id="474" data-count="1">0,00&nbsp;₽</span>
            </div>
            <input disabled type="hidden" name="text" value="Поддержка">
            <input disabled type="hidden" name="price" value="0.0">
            <input disabled type="hidden" name="quantity" value="1">
            <input disabled type="hidden" name="paymentSubjectType" value="service">
            <input disabled type="hidden" name="paymentMethodType" value="full_payment">
            <input disabled type="hidden" name="tax" value="1">
          </div>
        </div>
        <input value="" type="hidden" name="ym_merchant_receipt">
        <div class="ym-customer-info">
          <div class="ym-block-title">О покупателе</div>
          <input class="ym-input" name="email" placeholder="Телефон или Email для чека" type="text">
        </div>
        <input name="customerNumber" type="hidden" value="Добровольная поддержка Zapret UI">
        <input name="sumEqualPrice" type="hidden" value="true">
        <div class="ym-payment-btn-block ym-before-line ym-align-space-between">
          <div class="ym-input-icon-rub">
            <input name="sum" placeholder="0.00" class="ym-input ym-sum-input ym-required-input" type="number" step="any">
          </div>
          <button data-text="Поддержать" class="ym-btn-pay ym-result-price"><span class="ym-text-crop">Поддержать</span> <span class="ym-price-output"></span></button>
          <img src="https://yookassa.ru/integration/simplepay/img/iokassa-gray.svg?v=1.35.0" class="ym-logo" width="114" height="27" alt="ЮKassa">
        </div>
        <input name="shopId" type="hidden" value="1219833">
      </form>
    </div>
    <footer>
      <a href="./">К руководству</a>
      · <a href="https://github.com/RaccoonLaptop/ZapretUI">GitHub</a>
      · <a href="https://t.me/ZapretUI">Telegram</a>
    </footer>
  </div>
  <script src="https://yookassa.ru/integration/simplepay/js/yookassa_construct_form.js?v=1.35.0"></script>
</body>
</html>
