<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Поддержать Zapret UI</title>
  <meta name="description" content="Добровольная поддержка Zapret UI через ЮKassa.">
  <link rel="icon" href="https://raw.githubusercontent.com/RaccoonLaptop/ZapretUI/main/Assets/icon-readme.png">
  <link rel="stylesheet" href="https://yookassa.ru/integration/simplepay/css/yookassa_construct_form.css?v=1.35.0">
  <style>
    :root {
      --bg: #08090d;
      --surface: #10121a;
      --surface-light: #181b26;
      --border: #2d3348;
      --accent: #6b9fff;
      --accent-hover: #8ab4ff;
      --text: #e8ebf4;
      --muted: #a8b3d0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      font-size: 15px;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-hover); text-decoration: underline; }
    .wrap { max-width: 480px; margin: 0 auto; padding: 48px 20px 64px; }
    header { text-align: center; margin-bottom: 28px; }
    header img { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 14px; }
    h1 { font-size: 1.6rem; margin: 0 0 8px; font-weight: 650; }
    .lead { color: var(--muted); margin: 0; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 22px 22px 18px;
    }
    .yoomoney-payment-form {
      max-width: none;
      margin: 0;
      padding: 0;
      font-family: inherit;
      color: var(--text);
    }
    .yoomoney-payment-form .ym-block-title {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      margin: 0 0 8px;
    }
    .yoomoney-payment-form .ym-customer-info .ym-input { margin-top: 0; }
    .yoomoney-payment-form .ym-input {
      height: 44px;
      line-height: 44px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-light);
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      padding: 0 14px;
    }
    .yoomoney-payment-form .ym-input::placeholder { color: #6d7894; }
    .yoomoney-payment-form .ym-input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .yoomoney-payment-form .ym-before-line { padding-top: 0; }
    .yoomoney-payment-form .ym-before-line:before { display: none; }
    .yoomoney-payment-form .ym-payment-btn-block {
      height: auto;
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 12px;
    }
    .yoomoney-payment-form .ym-input-icon-rub {
      margin: 0;
      min-width: 0;
      width: 100%;
    }
    .yoomoney-payment-form .ym-input-icon-rub:after {
      color: var(--muted);
      height: 44px;
      line-height: 44px;
      right: 14px;
    }
    .yoomoney-payment-form .ym-input-icon-rub input { padding-right: 32px; }
    .yoomoney-payment-form .ym-payment-btn-block .ym-btn-pay {
      max-width: none;
      width: 100%;
      min-height: 46px;
      height: 46px;
      margin: 0;
      padding: 0 16px;
      border: 0;
      border-radius: 10px;
      background: #6b9fff;
      color: #10121a;
      font-family: inherit;
      font-size: 15px;
      font-weight: 650;
      justify-content: center;
      align-items: center;
      gap: 8px;
      text-transform: none;
      cursor: pointer;
    }
    .yoomoney-payment-form .ym-payment-btn-block .ym-btn-pay:hover { background: #8ab4ff; }
    .btn-icon { width: 18px; height: 18px; flex: 0 0 auto; }
    .pay-dialog {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(8, 9, 13, 0.72);
      z-index: 20;
    }
    .pay-dialog.open { display: flex; }
    .pay-panel {
      width: min(320px, 100%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
    }
    .pay-panel h2 {
      margin: 0 0 14px;
      font-size: 16px;
      font-weight: 650;
      text-align: center;
    }
    .pay-choice {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 46px;
      margin: 0 0 8px;
      border-radius: 10px;
      border: 1px solid #3a4260;
      background: #181b26;
      color: var(--text);
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }
    .pay-choice:hover { border-color: var(--accent); background: #222636; }
    .pay-choice:last-child { margin-bottom: 0; }
    .form-hint {
      display: none;
      margin: 8px 0 0;
      color: #f0a0ae;
      font-size: 13px;
      text-align: center;
    }
    .form-hint:not(:empty) { display: block; }
    .yoomoney-payment-form .ym-payment-btn-block .ym-btn-pay .ym-text-crop {
      flex: 0 0 auto;
      margin: 0;
      text-align: center;
    }
    .yoomoney-payment-form .ym-logo { display: none; }
    .note {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }
    footer { text-align: center; color: var(--muted); font-size: 13px; margin-top: 28px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <img src="https://raw.githubusercontent.com/RaccoonLaptop/ZapretUI/main/Assets/icon-readme.png" alt="Zapret UI">
      <h1>Поддержать Zapret UI</h1>
      <p class="lead">Сумму выбираете сами. Оплата откроется на странице ЮKassa.</p>
    </header>
    <div class="card">
      <form class="yoomoney-payment-form" action="https://yookassa.ru/integration/simplepay/payment" method="post" accept-charset="utf-8">
        <div class="ym-products ym-display-none">
          <div class="ym-product">
            <div class="ym-product-line">
              <span class="ym-product-description"><span class="ym-product-count">1×</span>Поддержка</span>
              <span class="ym-product-price" data-price="0.0" data-id="13" data-count="1">0,00&nbsp;₽</span>
            </div>
            <input disabled type="hidden" name="text" value="Поддержка">
            <input disabled type="hidden" name="price" value="0.0">
            <input disabled type="hidden" name="quantity" value="1">
            <input disabled type="hidden" name="paymentSubjectType" value="service">
            <input disabled type="hidden" name="paymentMethodType" value="full_payment">
            <input disabled type="hidden" name="tax" value="1">
          </div>
        </div>
        <input value="" type="hidden" name="ym_merchant_receipt">
        <div class="ym-customer-info">
          <div class="ym-block-title">Телефон или почта для чека</div>
          <input class="ym-input" name="email" placeholder="mail@example.com" type="text">
        </div>
        <div class="ym-hidden-inputs">
          <input name="shopSuccessURL" type="hidden" value="https://raccoonlaptop.github.io/ZapretUI/thanks.html">
          <input name="shopFailURL" type="hidden" value="https://raccoonlaptop.github.io/ZapretUI/donate.html">
        </div>
        <input name="customerNumber" type="hidden" value="Добровольная поддержка Zapret UI">
        <input name="sumEqualPrice" type="hidden" value="true">
        <div class="ym-payment-btn-block ym-before-line ym-align-space-between">
          <div class="ym-block-title">Сумма</div>
          <div class="ym-input-icon-rub">
            <input name="sum" placeholder="100" class="ym-input ym-sum-input ym-required-input" type="number" step="any" min="1">
          </div>
          <input name="paymentType" type="hidden" value="">
          <button type="button" id="openPay" data-text="Поддержать" class="ym-btn-pay ym-result-price"><svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg><span class="ym-text-crop">Поддержать</span> <span class="ym-price-output"></span></button>
          <p class="form-hint" id="formHint"></p>
          <img src="https://yookassa.ru/integration/simplepay/img/iokassa-gray.svg?v=1.35.0" class="ym-logo" width="114" height="27" alt="ЮKassa">
        </div>
        <input name="shopId" type="hidden" value="1219833">
      </form>
      <p class="note">Деньги приходят в ЮKassa. Это добровольная поддержка, без подписки.</p>
    </div>
    <div class="pay-dialog" id="payDialog" hidden>
      <div class="pay-panel" role="dialog" aria-modal="true" aria-labelledby="payTitle">
        <h2 id="payTitle">Выберите способ оплаты</h2>
        <button type="button" class="pay-choice" data-type="AC">
          <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 6.5A2.5 2.5 0 015.5 4h13A2.5 2.5 0 0121 6.5v11a2.5 2.5 0 01-2.5 2.5h-13A2.5 2.5 0 013 17.5v-11zM5.5 6a.5.5 0 00-.5.5V8h14V6.5a.5.5 0 00-.5-.5h-13zM5 15.5V10h14v5.5a.5.5 0 01-.5.5h-13a.5.5 0 01-.5-.5z"/></svg>
          Карта
        </button>
        <button type="button" class="pay-choice" data-type="CP">
          <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 2h10a2 2 0 012 2v16a2 2 0 01-2 2H7a2 2 0 01-2-2V4a2 2 0 012-2zm0 2v14h10V4H7zm5 16.2a1.2 1.2 0 100-2.4 1.2 1.2 0 000 2.4z"/></svg>
          СБП
        </button>
      </div>
    </div>
    <footer>
      <a href="./">К руководству</a>
      · <a href="https://github.com/RaccoonLaptop/ZapretUI">GitHub</a>
      · <a href="https://t.me/ZapretUI">Telegram</a>
    </footer>
  </div>
  <script src="https://yookassa.ru/integration/simplepay/js/yookassa_construct_form.js?v=1.35.0"></script>
  <script>
    const form = document.querySelector(".yoomoney-payment-form");
    const dialog = document.getElementById("payDialog");
    const hint = document.getElementById("formHint");

    function closePay() {
      dialog.classList.remove("open");
      dialog.hidden = true;
    }

    document.getElementById("openPay").addEventListener("click", function () {
      const email = form.email.value.trim();
      const sum = parseFloat(form.sum.value);
      if (!email) {
        hint.textContent = "Укажите телефон или почту для чека";
        form.email.focus();
        return;
      }
      if (!sum || sum <= 0) {
        hint.textContent = "Укажите сумму";
        form.sum.focus();
        return;
      }
      hint.textContent = "";
      dialog.hidden = false;
      dialog.classList.add("open");
    });

    dialog.addEventListener("click", function (event) {
      if (event.target === dialog) closePay();
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") closePay();
    });

    dialog.querySelectorAll(".pay-choice").forEach(function (button) {
      button.addEventListener("click", function () {
        form.paymentType.value = button.dataset.type;
        closePay();
        form.requestSubmit();
      });
    });
  </script>
</body>
</html>
