<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Спасибо — Zapret UI</title>
  <link rel="icon" href="https://raw.githubusercontent.com/RaccoonLaptop/ZapretUI/main/Assets/icon-readme.png">
  <style>
    :root {
      --bg: #08090d;
      --surface: #10121a;
      --border: #2d3348;
      --accent: #6b9fff;
      --accent-hover: #8ab4ff;
      --text: #e8ebf4;
      --muted: #a8b3d0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      font-size: 15px;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-hover); text-decoration: underline; }
    .wrap { max-width: 480px; margin: 0 auto; padding: 72px 20px; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 16px; }
    h1 { font-size: 1.6rem; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 22px; }
    .links a { margin: 0 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="https://raw.githubusercontent.com/RaccoonLaptop/ZapretUI/main/Assets/icon-readme.png" alt="Zapret UI">
    <h1>Спасибо</h1>
    <p>Поддержка Zapret UI получена.</p>
    <div class="links">
      <a href="./">К руководству</a>
      · <a href="https://github.com/RaccoonLaptop/ZapretUI">GitHub</a>
      · <a href="https://t.me/ZapretUI">Telegram</a>
    </div>
  </div>
  <script src="wavy.js"></script>
</body>
</html>
